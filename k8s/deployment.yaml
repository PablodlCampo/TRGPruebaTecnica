apiVersion: apps/v1
kind: Deployment
metadata:
  name: estimate-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: estimate-api
  template:
    metadata:
      labels:
        app: estimate-api
    spec:
      containers:
        - name: estimate-api
          image: trgpruebatecnica-api:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Development